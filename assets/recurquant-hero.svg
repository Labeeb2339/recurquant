<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">RecurQuant</title>
  <desc id="desc">Animated research banner for packed recurrent-state quantization. One of eighteen recurrent layers is highlighted at higher precision.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#202535" stroke-width="1"/>
    </pattern>
    <clipPath id="lane-clip">
      <rect x="862" y="68" width="458" height="224" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1400" height="360" fill="#0b0d12"/>
  <rect width="1400" height="360" fill="url(#grid)" opacity="0.34"/>
  <line x1="742" y1="54" x2="742" y2="306" stroke="#34394a"/>

  <g font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="112" fill="#f2f4f8" font-size="54" font-weight="650" letter-spacing="-1">RecurQuant</text>
    <text x="66" y="151" fill="#a8afbf" font-size="21">packed recurrent-state research</text>
    <text x="66" y="207" fill="#d8dcf4" font-size="17">Qwen3.5 Gated DeltaNet</text>
    <text x="66" y="235" fill="#8f98aa" font-size="15">layer 0 INT8 · 17 other recurrent layers INT4</text>

    <g transform="translate(66 274)" font-size="13" font-weight="600">
      <rect width="92" height="28" rx="6" fill="#222638" stroke="#555c78"/>
      <text x="46" y="19" fill="#c8cce1" text-anchor="middle">INT4 / INT8</text>
      <rect x="104" width="118" height="28" rx="6" fill="#222638" stroke="#555c78"/>
      <text x="163" y="19" fill="#c8cce1" text-anchor="middle">physical packing</text>
      <rect x="234" width="108" height="28" rx="6" fill="#222638" stroke="#555c78"/>
      <text x="288" y="19" fill="#c8cce1" text-anchor="middle">open evidence</text>
    </g>

    <g clip-path="url(#lane-clip)">
      <rect x="862" y="68" width="458" height="224" rx="14" fill="#11141c" stroke="#383e50"/>
      <g fill="#34394a">
        <rect x="890" y="94" width="348" height="6" rx="3"/>
        <rect x="890" y="106" width="382" height="6" rx="3"/>
        <rect x="890" y="118" width="320" height="6" rx="3"/>
        <rect x="890" y="130" width="366" height="6" rx="3"/>
        <rect x="890" y="142" width="334" height="6" rx="3"/>
        <rect x="890" y="154" width="390" height="6" rx="3"/>
        <rect x="890" y="166" width="352" height="6" rx="3"/>
        <rect x="890" y="178" width="374" height="6" rx="3"/>
        <rect x="890" y="190" width="330" height="6" rx="3"/>
        <rect x="890" y="202" width="384" height="6" rx="3"/>
        <rect x="890" y="214" width="344" height="6" rx="3"/>
        <rect x="890" y="226" width="370" height="6" rx="3"/>
        <rect x="890" y="238" width="326" height="6" rx="3"/>
        <rect x="890" y="250" width="380" height="6" rx="3"/>
        <rect x="890" y="262" width="338" height="6" rx="3"/>
        <rect x="890" y="274" width="360" height="6" rx="3"/>
      </g>
      <rect x="890" y="82" width="396" height="7" rx="3.5" fill="#a78bfa"/>
      <rect x="820" y="80" width="76" height="11" rx="5.5" fill="#d8b4fe" opacity="0.75">
        <animate attributeName="x" values="820;1292;820" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <circle cx="1286" cy="85.5" r="4" fill="#67e8f9">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="1088" y="323" fill="#c7cce0" font-size="14" text-anchor="middle">untouched MBPP test split</text>
    <text x="1088" y="344" fill="#9ca5ba" font-size="13" text-anchor="middle">72.75% lower task-macro excess NLL vs uniform INT4</text>
  </g>
</svg>
