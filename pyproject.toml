[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recurquant"
version = "0.2.0.dev0"
description = "Packed recurrent-state quantization for Gated DeltaNet language models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Muhammad Labeeb Aryan" },
]
keywords = [
  "gated-deltanet",
  "language-model-inference",
  "quantization",
  "recurrent-state",
  "transformers",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub>=0.36",
  "numpy>=2.0",
  "packaging>=24",
  "safetensors>=0.5",
  "torch>=2.7",
  # PackedRecurrentStateCache subclasses an internal cache layer. Keep the
  # tested minor pinned until its compatibility contract is covered in CI.
  "transformers>=5.14.1,<5.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]
eval = [
  "datasets>=4.3,<5",
]

[project.urls]
Homepage = "https://github.com/Labeeb2339/recurquant"
Repository = "https://github.com/Labeeb2339/recurquant"
Issues = "https://github.com/Labeeb2339/recurquant/issues"
"Compatibility and support" = "https://github.com/Labeeb2339/recurquant/blob/main/docs/compatibility.md"

[project.scripts]
recurquant = "recurquant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recurquant"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
