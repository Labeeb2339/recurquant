[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recurquant"
version = "0.1.0.dev0"
description = "Research harness for persistent-state quantization in Gated DeltaNet language models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Muhammad Labeeb Aryan" },
]
dependencies = [
  "huggingface-hub>=0.36",
  "numpy>=2.0",
  "safetensors>=0.5",
  "torch>=2.7",
  "transformers>=5.14.1,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[project.scripts]
recurquant = "recurquant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recurquant"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
