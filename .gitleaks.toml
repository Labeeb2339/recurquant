title = "RecurQuant secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Reproducibility hashes whose field names contain the word token"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''"(?:code_token_ids_sha256|prompt_token_ids_sha256|token_manifest_sha256)"\s*:\s*"[0-9a-f]{64}"''',
  '''"tokenizer_revision"\s*:\s*"[0-9a-f]{40}"''',
]
